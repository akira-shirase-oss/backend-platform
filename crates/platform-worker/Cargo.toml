[package]
name = "platform-worker"
description = "The Backend Platform's reconciler: claims operations under leases and runs their recorded steps through the provider adapters. The only process with provider credentials; it opens no listening socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Halt points for the process-kill drill (tests/kill_drill.rs). Never in a release build.
fault-injection = []

[[bin]]
name = "platform-worker"
path = "src/main.rs"

[[test]]
name = "kill_drill"
required-features = ["fault-injection"]

[dependencies]
anyhow.workspace = true
platform-adapters.workspace = true
platform-db.workspace = true
platform-domain.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
platform-db = { workspace = true, features = ["test-support"] }
platform-fake-provider.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
