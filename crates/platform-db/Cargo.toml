[package]
name = "platform-db"
description = "The Backend Platform's control store (PostgreSQL): desired state, the operation log, observed resources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TestDb: one throwaway database per test, created from BP_TEST_DATABASE_URL.
test-support = []

[[bin]]
name = "platform-dbctl"
path = "src/bin/platform-dbctl.rs"

[dependencies]
anyhow.workspace = true
platform-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio.workspace = true

[dev-dependencies]
platform-db = { path = ".", features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
