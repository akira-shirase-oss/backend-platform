[workspace]
members = ["crates/*", "fixtures/fake-provider"]
# The starter template is its own workspace, copied and owned by each product (D-036).
exclude = ["template"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/akira-shirase-oss/backend-platform"
publish = false

[workspace.dependencies]
platform-domain = { path = "crates/platform-domain" }
platform-db = { path = "crates/platform-db" }
platform-adapters = { path = "crates/platform-adapters" }
platform-worker = { path = "crates/platform-worker" }
platform-fake-provider = { path = "fixtures/fake-provider" }

# External crates: versions live here only. Minimal features; one async runtime (Tokio);
# no TLS stack (everything in B0 talks over loopback).
anyhow = "1.0.104"
axum = "0.8.9"
http-body-util = "0.1.5"
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "limit", "catch-panic", "sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[profile.release]
debug = "line-tables-only"
