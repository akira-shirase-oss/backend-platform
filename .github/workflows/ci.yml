name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new advisories appear without any code change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, architecture, tests, drills against PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same image and digest as deploy/compose.yaml.
        image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-dev
          POSTGRES_DB: platform
        ports:
          - 61432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=platform --dbname=platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      BP_TEST_DATABASE_URL: postgres://platform:platform-dev@127.0.0.1:61432/platform
    steps:
      # Third-party actions are pinned to commit SHAs (T8).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy on the fault-injection build (halt points for the kill drill)
        run: cargo clippy -p platform-worker --features fault-injection --all-targets --locked -- -D warnings
      - run: scripts/check-architecture.sh
      - name: The architecture check can fail
        run: |
          ! ARCH_DOMAIN_BANNED=thiserror scripts/check-architecture.sh
          ! ARCH_DOMAIN_PATTERN='pub fn' scripts/check-architecture.sh
          if cargo metadata --locked --format-version 1 --no-deps | grep -q '"name":"platform-server"'; then
            ! ARCH_SERVER_BANNED=platform-db scripts/check-architecture.sh
          fi
          scripts/test-architecture-check.sh
      - name: Images and actions are pinned (T8), and the check can fail
        run: |
          scripts/check-pins.sh
          printf 'services:\n  db:\n    image: postgres:18\n' > "$RUNNER_TEMP/unpinned-image.yaml"
          ! scripts/check-pins.sh "$RUNNER_TEMP/unpinned-image.yaml"
          printf 'steps:\n  - uses: actions/checkout@v7\n' > "$RUNNER_TEMP/unpinned-action.yaml"
          ! scripts/check-pins.sh "$RUNNER_TEMP/unpinned-action.yaml"
      - name: Ports stay in the band 61400-61499, and the check can fail
        run: |
          scripts/check-ports.sh
          # The offending value reaches the sample files through %s, so this workflow holds none.
          printf 'ports:\n      - "%s:8000"\n' 58000 > "$RUNNER_TEMP/outofband-mapping.yaml"
          ! scripts/check-ports.sh "$RUNNER_TEMP/outofband-mapping.yaml"
          printf 'curl http://127.0.0.1:%s/health\n' 8080 > "$RUNNER_TEMP/outofband-literal.txt"
          ! scripts/check-ports.sh "$RUNNER_TEMP/outofband-literal.txt"
      - name: Tests, including drill partial-provision over 10,000 in-process fault schedules
        run: cargo test --workspace --locked
      - name: Drill partial-provision, process level (the real worker killed with SIGKILL)
        run: cargo test -p platform-worker --features fault-injection --test kill_drill --locked
      - name: Fuzz smoke (seed corpus replay + 512 generated cases per parser of outside input)
        run: scripts/fuzz-smoke.sh --cases 512
      - name: Load probe (a short control-API run on non-default band ports; the evidence runs are the load workflow's)
        env:
          BP_LOAD_ADMIN_URL: postgres://platform:platform-dev@127.0.0.1:61432/platform
        run: |
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" TOTAL=2000 RATE=200 PROJECTS=100 BP_SERVER_PORT=61470 BP_FAKE_PORT=61471 scripts/load.sh

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # B1-T: the starter template is its own workspace with its own gate and stack, exactly as
  # a product's copy runs it (template/.github/workflows/ci.yml).
  template:
    name: starter template (template/scripts/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: template
      # A version this install-action release lists with its checksum; no fallback to an
      # unverified download.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Tools the drills use (age and k6 pinned by checksum)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3
          scripts/install-age.sh "$RUNNER_TEMP/bin"
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The README's quickstart, as written; it ends with the gate (scripts/check.sh).
      - name: The README quickstart, then the gate
        run: scripts/test-readme.sh

  template-limits:
    name: starter template (every limit's test fails without the limit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: template
      - name: Database
        run: scripts/stack.sh up
      - name: Prove every limit
        run: |
          eval "$(scripts/stack.sh env)"
          scripts/prove-limits.sh

  # Every attack test must fail without its protection: each ATTACK(name) marker in the
  # source maps to a mutation, the mutated tree runs the named test, and the proof only
  # accepts a real test failure (not a compile error). Its own job so it reports on every
  # push even when another suite is red.
  attacks:
    name: every attack test fails without its protection (platform)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Same image and digest as deploy/compose.yaml.
        image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-dev
          POSTGRES_DB: platform
        ports:
          - 61432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=platform --dbname=platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      BP_TEST_DATABASE_URL: postgres://platform:platform-dev@127.0.0.1:61432/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Prove every attack test
        run: scripts/prove-attacks.sh

  template-attacks:
    name: every attack test fails without its protection (starter template)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: template
      - name: Database
        run: scripts/stack.sh up
      - name: Prove every attack test
        run: |
          eval "$(scripts/stack.sh env)"
          scripts/prove-attacks.sh

  # Copy and own: the copy script renames the template for a product, and the copy builds,
  # passes clippy and its tests with no template name left (template/docs/COPYING.md).
  template-copy:
    name: starter template (a renamed copy builds and passes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' template/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Database
        working-directory: template
        run: scripts/stack.sh up
      - name: Copy as "copytest" and verify
        run: |
          eval "$(template/scripts/stack.sh env)"
          scripts/copy-template.sh "$RUNNER_TEMP/copytest" copytest --verify

  # The production path, end to end: the operator guide's install, check, upgrade and
  # rollback blocks run as written on an Ubuntu 24.04 VM with systemd
  # (template/scripts/test-install.sh): hardening, env and credentials, the hardened unit,
  # Caddy with TLS, deploy and rollback.
  template-install:
    name: starter template (the operator guide, end to end on Ubuntu 24.04 with systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: template
      - name: What a fresh droplet has (openssh-server, ufw)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server ufw
      - name: The release build
        run: cargo build --release --locked -p starter-server
      - name: The database (standing in for Neon)
        run: scripts/stack.sh up
      - name: Follow the operator guide
        run: sudo -E env "PATH=$PATH" scripts/test-install.sh
